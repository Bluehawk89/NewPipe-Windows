# SPDX-License-Identifier: GPL-3.0-or-later
# Prototype only: compiles the existing Compose Desktop entry point into a Windows MSI.
name: Windows desktop installer (prototype)

on:
  push:
    branches:
      - 'windows/**'
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'desktopApp/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew*'
      - 'buildSrc/**'
      - '*.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    name: Build MSI on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37.0 using the runner's preinstalled SDK
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { throw "ANDROID_HOME is missing from Windows runner" }
          $sdkManager = Get-ChildItem -Path (Join-Path $sdkRoot 'cmdline-tools') -Recurse -File -Filter 'sdkmanager.bat' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkManager) { throw "Android sdkmanager.bat not found" }
          & $sdkManager "--sdk_root=$sdkRoot" "--channel=3" "platforms;android-37.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed" }

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Windows desktop regression tests
        shell: pwsh
        run: .\gradlew.bat :desktopApp:test --stacktrace --no-configuration-cache

      - name: Upload desktop test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-test-report
          path: desktopApp/build/test-results/test/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Fetch pinned upstream libmpv Windows runtime
        shell: pwsh
        run: |
          # This DLL comes from the original mpv project's own published
          # Windows build. A changed release asset fails closed: never
          # package a native binary that fails the pinned checksum.
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/mpv-player/mpv/releases/download/git-release/libmpv-v0.41.0-dev-g6a262d11f-39135297726-x86_64-w64-mingw32-gpl.zip'
          $expected = '9d27aea7cdc0bf2c484d5cbf57f546fee0c9618a378dd811f7b3c1ed771515a0'
          $zip = Join-Path $env:RUNNER_TEMP 'libmpv-pinned.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'libmpv-pinned'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $expected) {
            throw "libmpv SHA256 mismatch. Refusing to package unverified native code."
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $unpack -Force
          $dll = Get-ChildItem -Path $unpack -File -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (-not $dll) { throw 'Official libmpv ZIP did not contain libmpv-2.dll' }
          $dest = Join-Path $PWD 'desktopApp/appResources/windows-x64'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $dest 'libmpv-2.dll')
          Write-Host 'Verified upstream mpv DLL staged for native Windows MSI'
          # Smoke-check that Windows can resolve the real native library
          # and its required dependencies before spending time on MSI.
          $dllPath = Join-Path $dest 'libmpv-2.dll'
          $nativeHandle = [System.Runtime.InteropServices.NativeLibrary]::Load($dllPath)
          try {
            $required = @(
              'mpv_create', 'mpv_initialize', 'mpv_command',
              'mpv_render_context_create',
              'mpv_render_context_set_update_callback',
              'mpv_render_context_update',
              'mpv_render_context_render',
              'mpv_render_context_report_swap',
              'mpv_render_context_free'
            )
            foreach ($symbol in $required) {
              $export = [System.Runtime.InteropServices.NativeLibrary]::GetExport(
                $nativeHandle, $symbol
              )
              if ($export -eq [IntPtr]::Zero) {
                throw "Native mpv export missing: $symbol"
              }
            }
            Write-Host 'Windows loaded pinned libmpv and validated render API exports'
          }
          finally {
            [System.Runtime.InteropServices.NativeLibrary]::Free($nativeHandle)
          }
      
      - name: Package desktop application as MSI
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageMsi --stacktrace --no-configuration-cache

      - name: Verify packaged Java runtime and GPU memory backend
        shell: pwsh
        run: |
          # Pure JVM tests use a full JDK and missed a real packaged-app
          # crash. Execute --gpu-preflight on the reduced jlink app image.
          $ErrorActionPreference = 'Stop'
          & .\gradlew.bat :desktopApp:createDistributable --stacktrace --no-configuration-cache
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows app-image' }
          $root = Join-Path $PWD 'desktopApp/build/compose/binaries/main/app'
          if (-not (Test-Path $root)) { throw 'Windows app-image not created' }
          $java = Get-ChildItem -Path $root -File -Recurse -Filter 'java.exe' |
            Where-Object { $_.FullName -match '[\\/]runtime[\\/]bin[\\/]' } |
            Select-Object -First 1
          if (-not $java) { throw 'Packaged Java runtime not found' }
          $modules = & $java.FullName --list-modules
          if ($LASTEXITCODE -ne 0 -or
              -not (@($modules | Where-Object { $_ -match '^jdk\.unsupported@' }).Count -gt 0)) {
            throw 'Packaged Java runtime is missing jdk.unsupported'
          }
          $launcher = Get-ChildItem -Path $root -File -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -eq 'NewPipe Windows Prototype.exe' } |
            Select-Object -First 1
          if (-not $launcher) { throw 'Packaged Windows application launcher missing' }
          $process = Start-Process -FilePath $launcher.FullName -ArgumentList '--gpu-preflight' -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged GPU preflight timed out after 30 seconds'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged LWJGL preflight failed (code $($process.ExitCode))"
          }
          Write-Host 'Verified packaged Java module and LWJGL backend; no UI needed.'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: newpipe-windows-prototype-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14
