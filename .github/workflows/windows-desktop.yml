# Prototype only: compiles the existing Compose Desktop entry point into a Windows MSI.
name: Windows desktop installer (prototype)

on:
  push:
    branches:
      - 'windows/**'
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'desktopApp/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew*'
      - 'buildSrc/**'
      - '*.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    name: Build MSI on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37.0 using the runner's preinstalled SDK
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { throw "ANDROID_HOME is missing from Windows runner" }
          $sdkManager = Get-ChildItem -Path (Join-Path $sdkRoot 'cmdline-tools') -Recurse -File -Filter 'sdkmanager.bat' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkManager) { throw "Android sdkmanager.bat not found" }
          & $sdkManager "--sdk_root=$sdkRoot" "--channel=3" "platforms;android-37.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed" }

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Windows desktop regression tests
        shell: pwsh
        run: .\gradlew.bat :desktopApp:test --stacktrace --no-configuration-cache

      - name: Upload desktop test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-test-report
          path: desktopApp/build/test-results/test/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Package desktop application as MSI
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageMsi --stacktrace --no-configuration-cache

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: newpipe-windows-prototype-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14
